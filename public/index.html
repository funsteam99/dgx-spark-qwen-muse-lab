<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e5db">
  <title>Splitframe — 雙模型視覺實驗室</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="brand"><span class="mark">S/F</span><div><strong>Splitframe</strong><small>雙模型視覺實驗室</small></div></div>
    <div class="sync-tools">
      <label class="sync-toggle"><input id="syncMode" type="checkbox" checked><span></span>同步送出</label>
      <button id="clearAll" class="text-btn">清空全部</button>
    </div>
    <div class="health" aria-label="服務狀態"><span id="qwenHealth" class="dot"></span>8002 <span id="museHealth" class="dot"></span>8004</div>
  </header>

  <main class="split">
    <section class="lane qwen" data-side="qwen">
      <header class="lane-head"><div><span class="index">01</span><h1>Qwen 3.6</h1><p>原生多模態 · MTP speculative</p></div><button class="clear-one" title="清空 Qwen 對話">清空</button></header>
      <div class="telemetry"><span><b>64K</b> context</span><span><b>3</b> MTP draft</span><span class="last-metric">尚未測試</span></div>
      <div class="messages" aria-live="polite"><div class="empty"><span>Q</span><p>丟入一張圖，問它看見什麼。<br>或開啟同步，讓兩邊回答同一題。</p></div></div>
      <div class="composer-wrap">
        <div class="previews"></div>
        <div class="composer">
          <label class="attach" title="加入圖片"><input type="file" accept="image/*" multiple><span>＋</span></label>
          <textarea rows="1" placeholder="問 Qwen…（可貼上圖片）"></textarea>
          <button class="send" aria-label="送出"><span>↗</span></button>
        </div>
      </div>
    </section>

    <div class="spine"><span>VS</span></div>

    <section class="lane muse" data-side="muse">
      <header class="lane-head"><div><span class="index">02</span><h1>Muse Glimmer</h1><p>GGUF vision · DFlash accelerated</p></div><button class="clear-one" title="清空 Muse 對話">清空</button></header>
      <div class="telemetry"><span><b>32K</b> context</span><span><b>15</b> DFlash draft</span><span class="last-metric">尚未測試</span></div>
      <div class="messages" aria-live="polite"><div class="empty"><span>M</span><p>同一張圖、同一個問題。<br>直接比較細節、推理與速度。</p></div></div>
      <div class="composer-wrap">
        <div class="previews"></div>
        <div class="composer">
          <label class="attach" title="加入圖片"><input type="file" accept="image/*" multiple><span>＋</span></label>
          <textarea rows="1" placeholder="問 Muse…（可貼上圖片）"></textarea>
          <button class="send" aria-label="送出"><span>↗</span></button>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
