<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e5db">
  <title>Splitframe — 多模型視覺與推理實驗室</title>
  <link rel="stylesheet" href="/vendor/katex.min.css?v=20260820_10">
  <link rel="stylesheet" href="/styles.css?v=20260820_10">
  <script src="/vendor/marked.min.js?v=20260820_10"></script>
  <script src="/vendor/katex.min.js?v=20260820_10"></script>
  <script src="/vendor/auto-render.min.js?v=20260820_10"></script>
  <script src="/vendor/mermaid.min.js?v=20260820_10"></script>
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <span class="mark">S/F</span>
      <div><strong>Splitframe</strong><small>多模型視覺與推理實驗室</small></div>
    </div>
    <div class="sync-tools">
      <label class="sync-toggle"><input id="syncMode" type="checkbox" checked><span></span>同步送出</label>
      <label class="token-limit">輸出 <select id="maxTokens" aria-label="最大輸出 tokens"><option>512</option><option>1024</option><option>2048</option><option selected>4096</option><option>8192</option></select></label>
      <button id="clearAll" class="text-btn">清空全部</button>
    </div>
    <div class="health" aria-label="服務狀態">
      <span title="Port 8002 (Qwen 3.6)"><span id="qwenHealth" class="dot"></span>8002</span>
      <span title="Port 8006 (Qwen 3.8)"><span id="qwen38Health" class="dot"></span>8006</span>
      <span title="Port 8004 (Muse)"><span id="museHealth" class="dot"></span>8004</span>
    </div>
  </header>

  <main class="split">
    <!-- Left Lane (Default: Qwen 3.6) -->
    <section class="lane qwen" data-side="left" data-model="qwen">
      <header class="lane-head">
        <div>
          <div class="head-top">
            <span class="index">01</span>
            <select class="model-select" aria-label="選擇左側模型">
              <option value="qwen" selected>Qwen 3.6 (8002)</option>
              <option value="qwen38">Qwen 3.8 (8006)</option>
              <option value="muse">Muse Glimmer (8004)</option>
            </select>
            <label class="think-toggle" title="切換思考模式 (enable_thinking)"><input type="checkbox" class="think-cb"><span>🧠 思考</span></label>
          </div>
          <h1 class="model-title">Qwen 3.6</h1>
          <p class="model-desc">原生多模態 · MTP speculative</p>
        </div>
        <button class="clear-one" title="清空此對話">清空</button>
      </header>
      <div class="telemetry">
        <span class="t-context"><b>256K</b> context</span>
        <span class="t-draft"><b>3</b> MTP draft</span>
        <span class="last-metric">尚未測試</span>
      </div>
      <div class="messages" aria-live="polite">
        <div class="empty">
          <span class="empty-icon">Q3.6</span>
          <p class="empty-text">丟入一張圖，問它看見什麼。<br>或開啟同步，讓兩邊回答同一題。</p>
        </div>
      </div>
      <div class="composer-wrap">
        <div class="previews"></div>
        <div class="composer">
          <label class="attach" title="加入圖片"><input type="file" accept="image/*" multiple><span>＋</span></label>
          <textarea rows="1" placeholder="問 Qwen 3.6…（可貼上或拖入圖片）"></textarea>
          <button class="send" aria-label="送出"><span>↗</span></button>
        </div>
      </div>
    </section>

    <div class="spine"><span>VS</span></div>

    <!-- Right Lane (Default: Qwen 3.8) -->
    <section class="lane qwen38" data-side="right" data-model="qwen38">
      <header class="lane-head">
        <div>
          <div class="head-top">
            <span class="index">02</span>
            <select class="model-select" aria-label="選擇右側模型">
              <option value="qwen">Qwen 3.6 (8002)</option>
              <option value="qwen38" selected>Qwen 3.8 (8006)</option>
              <option value="muse">Muse Glimmer (8004)</option>
            </select>
            <label class="think-toggle" title="切換思考模式 (enable_thinking)"><input type="checkbox" class="think-cb" checked><span>🧠 思考</span></label>
          </div>
          <h1 class="model-title">Qwen 3.8</h1>
          <p class="model-desc">27B NVFP4 · 視覺推理增強</p>
        </div>
        <button class="clear-one" title="清空此對話">清空</button>
      </header>
      <div class="telemetry">
        <span class="t-context"><b>128K</b> context</span>
        <span class="t-draft"><b>3</b> MTP draft</span>
        <span class="last-metric">尚未測試</span>
      </div>
      <div class="messages" aria-live="polite">
        <div class="empty">
          <span class="empty-icon">Q3.8</span>
          <p class="empty-text">同一張圖、同一個問題。<br>直接比較細節、推理與速度。</p>
        </div>
      </div>
      <div class="composer-wrap">
        <div class="previews"></div>
        <div class="composer">
          <label class="attach" title="加入圖片"><input type="file" accept="image/*" multiple><span>＋</span></label>
          <textarea rows="1" placeholder="問 Qwen 3.8…（可貼上或拖入圖片）"></textarea>
          <button class="send" aria-label="送出"><span>↗</span></button>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script type="module" src="/app.js?v=20260820_10"></script>
</body>
</html>
